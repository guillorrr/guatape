upstream php-fpm {
    server api:9000;
}

# Plain HTTP: TLS terminates in front of this container (Caddy, Traefik, a
# Cloudflare tunnel, a load balancer…). Laravel learns the original scheme
# and client IP from X-Forwarded-* only for TRUSTED_PROXIES (.env.prod).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/api/public;
    index index.php index.html;

    client_max_body_size 64M;

    # Laravel: API, Sanctum's CSRF cookie and the /up health check.
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Laravel's public disk (storage/app/public).
    location /storage/ {
        alias /var/www/api/storage/app/public/;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Hashed SPA assets: cache forever.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA; index.html must never be cached, or a deploy
    # keeps serving the previous bundle names.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
