; PHP overrides for DEVELOPMENT only.
;
; Not baked into the image: docker-compose.yml mounts this file into the dev
; container's conf.d and docker-compose.prod.yml does not. The Dockerfile builds
; dev and production from the same php.ini layer, so raising a limit there would
; raise it for production PHP-FPM too.

; A growing PHPUnit suite runs in a single process and accumulates memory; the
; image's 256M ends up killing the run near the end. That's not a production
; concern (no request accumulates a whole test suite), so the high limit lives here.
memory_limit = 1G
