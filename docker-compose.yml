services:
  # --- Database ---
  db:
    image: mysql:8.4
    container_name: ${APP_NAME}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-guatape}
      MYSQL_USER: ${DB_USERNAME:-guatape}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Laravel API ---
  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-api
    restart: unless-stopped
    working_dir: /var/www/api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-guatape}
      DB_USERNAME: ${DB_USERNAME:-guatape}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    volumes:
      - ./src/api:/var/www/api
      - api_vendor:/var/www/api/vendor
      - ./docker/api/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    ports:
      - "${API_PORT:-9000}:9000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  # --- Vue 3 Frontend ---
  frontend:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./src/frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - app-network

  # --- Storybook ---
  storybook:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: ${APP_NAME}-storybook
    restart: unless-stopped
    working_dir: /app/frontend
    command: npm run storybook -- --host 0.0.0.0 --port 6006
    volumes:
      - ./src/frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    networks:
      - app-network
    profiles:
      - storybook

  # --- Nginx ---
  nginx:
    image: nginx:alpine
    container_name: ${APP_NAME}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./src/api/public:/var/www/api/public
      - ./certs:/etc/nginx/certs
    depends_on:
      - api
      - frontend
    networks:
      - app-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${APP_NAME}-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    depends_on:
      - db
    networks:
      - app-network
    profiles:
      - tools

  # --- Mailhog ---
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${APP_NAME}-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - app-network
    profiles:
      - tools

  # --- mkcert ---
  mkcert:
    image: vishnunair/docker-mkcert
    container_name: ${APP_NAME}-mkcert
    volumes:
      - ./certs:/root/.local/share/mkcert
      - ./docker/mkcert/entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh
    environment:
      DOMAIN: ${DOMAIN:-guatape.local}
    profiles:
      - setup

volumes:
  db_data:
  redis_data:
  api_vendor:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
