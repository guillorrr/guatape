name: CI

# Runs on every push and pull request; deploy.yml reuses it as its gate.
on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pint + PHPUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_testing
          MYSQL_USER: app
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, gd, zip, bcmath, intl, sodium, redis, exif
          coverage: none

      - uses: actions/cache@v4
        with:
          path: src/api/vendor
          key: composer-${{ hashFiles('src/api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: app
          DB_TEST_DATABASE: app_testing
          DB_USERNAME: app
          DB_PASSWORD: secret
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    name: Frontend (lint, types, Vitest, build, Storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # --prefix pins the install to src/frontend: without it npm finds the root
      # package.json (workspaces) and demands a root package-lock.json.
      - run: npm ci --prefix .
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
      - name: Storybook builds
        run: npx storybook build --quiet -o storybook-static
